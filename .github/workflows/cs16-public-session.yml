name: CS 1.6 self-healing session (GitHub-hosted)

on:
  # Apply server.cfg / FastDL changes by queueing one replacement session.
  # The concurrency group keeps it behind any currently active session.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cs16-public-session.yml'
      - 'config/server.cfg.example'
  # The Vercel watchdog dispatches a fresh run only when no session is active.
  workflow_dispatch:
    inputs:
      maxplayers:
        description: Server slot target for this session
        required: true
        type: choice
        options:
          - "20"
          - "32"
        default: "20"

permissions:
  contents: write

concurrency:
  group: cs16-public-session
  cancel-in-progress: false

jobs:
  public-session:
    name: Run ReHLDS, Playit, and optional Bore SSH access
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MAXPLAYERS: ${{ github.event.inputs.maxplayers || '20' }}

    steps:
      - name: Check out server configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Validate Playit secret is configured
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAYIT_SECRET_KEY:-}" ]]; then
            echo "Missing repository Actions secret PLAYIT_SECRET_KEY." >&2
            echo "Create a Playit Docker agent key and add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Install Linux and GoldSrc 32-bit dependencies
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gpg unzip file openssl \
            lib32gcc-s1 lib32stdc++6 lib32z1 libc6:i386 libstdc++6:i386 openssh-server
          # Disable the package's default public listener; the managed daemon binds only to loopback:2222.
          sudo systemctl disable --now ssh.service ssh.socket 2>/dev/null || true
          sudo pkill -x sshd 2>/dev/null || true

      - name: Download SteamCMD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd/steamcmd_linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          test -x "$RUNNER_TEMP/steamcmd/steamcmd.sh"

      - name: Install CS 1.6 base server files (App 90)
        run: |
          set -euo pipefail
          bash scripts/install-base-hlds.sh \
            "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            "$RUNNER_TEMP/hlds"

      - name: Install Steamworks runtime (App 1007)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamworks-redist"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +force_install_dir "$RUNNER_TEMP/steamworks-redist" \
            +login anonymous \
            +app_update 1007 validate \
            +quit

      - name: Link 32-bit Steam client runtime
        run: |
          set -euo pipefail
          mapfile -t CANDIDATES < <(find "$RUNNER_TEMP/steamworks-redist" "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/hlds" "$HOME/.steam" \
            -type f -name steamclient.so -print 2>/dev/null || true)

          STEAMCLIENT=""
          for candidate in "${CANDIDATES[@]}"; do
            DESCRIPTION="$(file -b "$candidate" || true)"
            if [[ "$DESCRIPTION" == *"ELF 32-bit"* ]]; then
              STEAMCLIENT="$candidate"
              break
            fi
          done

          if [[ -z "$STEAMCLIENT" ]]; then
            echo "ERROR: No 32-bit steamclient.so found." >&2
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          mkdir -p "$HOME/.steam/sdk32"
          ln -sfn "$STEAMCLIENT" "$HOME/.steam/sdk32/steamclient.so"
          ldd "$HOME/.steam/sdk32/steamclient.so" | tee "$RUNNER_TEMP/steamclient-dependencies.txt"
          if grep -q "not found" "$RUNNER_TEMP/steamclient-dependencies.txt"; then
            echo "ERROR: Steam client library dependencies are missing." >&2
            exit 1
          fi

      - name: Install signed ReHLDS
        env:
          REHLDS_VERSION: 3.15.0.896
        run: |
          set -euo pipefail
          bash scripts/install-rehlds.sh "$RUNNER_TEMP/hlds"
          grep -Fx "version=3.15.0.896" "$RUNNER_TEMP/hlds/rehlds-build.txt"
          grep -Fx "signature=VALID" "$RUNNER_TEMP/hlds/rehlds-build.txt"

      - name: Snapshot stock downloadable assets before mod overlay
        run: |
          set -euo pipefail
          python3 scripts/export-necrohazard-fastdl.py snapshot \
            "$RUNNER_TEMP/hlds" "$RUNNER_TEMP/base-fastdl-manifest.json"

      - name: Install Metamod-R and ReUnion
        env:
          METAMOD_VERSION: 1.3.0.149
          REUNION_VERSION: 0.2.0.25
          REUNION_HASH_SALT: ${{ secrets.REUNION_HASH_SALT }}
        run: |
          set -euo pipefail
          bash scripts/install-reunion.sh "$RUNNER_TEMP/hlds"

      - name: Export NECROHAZARD maps, models, sprites, and sounds to FastDL
        run: |
          set -euo pipefail
          python3 scripts/export-necrohazard-fastdl.py publish \
            "$RUNNER_TEMP/hlds" \
            "$RUNNER_TEMP/base-fastdl-manifest.json" \
            "$GITHUB_WORKSPACE/dashboard/fastdl/cstrike" \
            "$GITHUB_WORKSPACE/dashboard/fastdl/EXPORT-REPORT.txt"

      - name: Publish generated FastDL assets to GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/fastdl/cstrike dashboard/fastdl/EXPORT-REPORT.txt
          if git diff --cached --quiet; then
            echo "FastDL is already up to date."
          else
            git commit -m "Publish NECROHAZARD Zombie Plague FastDL assets"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure server for public session
        run: |
          set -euo pipefail
          sed -E 's/^sv_lan[[:space:]]+1$/sv_lan 0/' \
            config/server.cfg.example > "$RUNNER_TEMP/hlds/cstrike/server.cfg"
          # Check the public setting and queue the plugin status command after map load.
          grep -Eq '^[[:space:]]*sv_lan[[:space:]]+0([[:space:]]|$)' "$RUNNER_TEMP/hlds/cstrike/server.cfg"
          printf '\nmeta list\n' >> "$RUNNER_TEMP/hlds/cstrike/server.cfg"
          RCON_PASSWORD="$(openssl rand -hex 24)"
          printf '\nrcon_password "%s"\n' "$RCON_PASSWORD" >> "$RUNNER_TEMP/hlds/cstrike/server.cfg"
          unset RCON_PASSWORD
          chmod 0600 "$RUNNER_TEMP/hlds/cstrike/server.cfg"

      - name: Run self-healing ReHLDS, Playit, and SSH session
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
          SSH_HOST_ED25519_PRIVATE_KEY: ${{ secrets.SSH_HOST_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash scripts/run-public-session.sh "$RUNNER_TEMP/hlds" "$MAXPLAYERS" "$RUNNER_TEMP/rehlds-session.log"

      - name: Capture session logs and stop remaining tunnel containers
        if: always()
        run: |
          set +e
          if docker inspect playit >/dev/null 2>&1; then
            docker logs --tail 200 playit >> "$RUNNER_TEMP/playit-agent.log" 2>&1
            docker stop playit >/dev/null 2>&1
          fi
          if docker inspect bore >/dev/null 2>&1; then
            docker logs --tail 200 bore >> "$RUNNER_TEMP/bore.log" 2>&1
            docker stop bore >/dev/null 2>&1
          fi
          true

      - name: Upload server and tunnel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs16-session-logs
          path: |
            ${{ runner.temp }}/rehlds-session.log
            ${{ runner.temp }}/playit-agent.log
            ${{ runner.temp }}/bore.log
          if-no-files-found: ignore
          retention-days: 3
