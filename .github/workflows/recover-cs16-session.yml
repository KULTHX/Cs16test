name: Recover public CS 1.6 session

on:
  push:
    branches: [main]
    paths:
      - ".github/session-recovery.trigger"

permissions:
  actions: write
  contents: read

concurrency:
  group: cs16-session-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale sessions and dispatch one replacement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_runs="repos/${GITHUB_REPOSITORY}/actions/workflows/cs16-public-session.yml/runs?per_page=100"

          for attempt in $(seq 1 8); do
            mapfile -t active_runs < <(
              gh api "$workflow_runs" --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | .id'
            )

            if [[ ${#active_runs[@]} -eq 0 ]]; then
              break
            fi

            for run_id in "${active_runs[@]}"; do
              echo "Cancelling stale public session run $run_id"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" || true
            done
            sleep 3
          done

          mapfile -t remaining_runs < <(
            gh api "$workflow_runs" --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | .id'
          )
          if [[ ${#remaining_runs[@]} -gt 0 ]]; then
            echo "ERROR: old session runs still active or queued: ${remaining_runs[*]}" >&2
            exit 1
          fi

          echo "All stale session runs are stopped. Dispatching one fresh 20-slot session."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/cs16-public-session.yml/dispatches" \
            -f ref=main -f 'inputs[maxplayers]=20'
          echo "Fresh public-session workflow dispatch accepted."
