name: ReHLDS local smoke test

on:
  # Run the smoke test automatically when this workflow definition changes.
  # This is bounded CI validation, not a persistent public game-server service.
  push:
    branches: [main]
    paths:
      - ".github/workflows/rehlds-smoke.yml"
      - "scripts/install-rehlds.sh"
      - "scripts/install-reunion.sh"
  workflow_dispatch:
    inputs:
      maxplayers:
        description: Player slots for the local startup test
        required: true
        type: choice
        options:
          - "20"
          - "32"
        default: "20"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Install and start ReHLDS locally
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 32-bit runtime and tooling
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gpg unzip file lib32gcc-s1 lib32stdc++6 lib32z1

      - name: Download SteamCMD
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd/steamcmd_linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          test -x "$RUNNER_TEMP/steamcmd/steamcmd.sh"

      - name: Install the required CS 1.6 server base
        run: |
          bash scripts/install-base-hlds.sh \
            "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            "$RUNNER_TEMP/hlds"

      - name: Install official Steamworks server runtime (App 1007)
        run: |
          mkdir -p "$RUNNER_TEMP/steamworks-redist"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +force_install_dir "$RUNNER_TEMP/steamworks-redist" \
            +login anonymous \
            +app_update 1007 validate \
            +quit

      - name: Link the 32-bit Steam client runtime for HLDS
        run: |
          mapfile -t CANDIDATES < <(find "$RUNNER_TEMP/steamworks-redist" "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/hlds" "$HOME/.steam" \
            -type f -name steamclient.so -print 2>/dev/null || true)

          STEAMCLIENT=""
          for candidate in "${CANDIDATES[@]}"; do
            DESCRIPTION="$(file -b "$candidate" || true)"
            if [[ "$DESCRIPTION" == *"ELF 32-bit"* ]]; then
              STEAMCLIENT="$candidate"
              break
            fi
          done

          if [[ -z "$STEAMCLIENT" ]]; then
            echo "ERROR: No 32-bit steamclient.so was found in Steamworks App 1007 or SteamCMD." >&2
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          STEAMCLIENT_DIR="$(dirname "$STEAMCLIENT")"
          export LD_LIBRARY_PATH="$STEAMCLIENT_DIR:$RUNNER_TEMP/steamcmd/linux32:${LD_LIBRARY_PATH:-}"
          mkdir -p "$HOME/.steam/sdk32"
          ln -sfn "$STEAMCLIENT" "$HOME/.steam/sdk32/steamclient.so"
          file "$HOME/.steam/sdk32/steamclient.so"
          ldd "$HOME/.steam/sdk32/steamclient.so" | tee "$RUNNER_TEMP/steamclient-dependencies.txt"
          if grep -q "not found" "$RUNNER_TEMP/steamclient-dependencies.txt"; then
            echo "ERROR: One or more 32-bit Steam client dependencies are missing." >&2
            exit 1
          fi
          echo "Linked verified 32-bit Steam client runtime from: $STEAMCLIENT"

      - name: Replace the engine with signed ReHLDS
        env:
          REHLDS_VERSION: 3.15.0.896
        run: |
          bash scripts/install-rehlds.sh "$RUNNER_TEMP/hlds"
          grep -Fx "version=3.15.0.896" "$RUNNER_TEMP/hlds/rehlds-build.txt"
          grep -Fx "signature=VALID" "$RUNNER_TEMP/hlds/rehlds-build.txt"

      - name: Install Metamod-R and ReUnion
        env:
          METAMOD_VERSION: 1.3.0.149
          REUNION_VERSION: 0.2.0.25
        run: bash scripts/install-reunion.sh "$RUNNER_TEMP/hlds"

      - name: Prepare loopback-only test configuration
        run: |
          sed -E 's/^sv_lan[[:space:]]+0$/sv_lan 1/' \
            config/server.cfg.example > "$RUNNER_TEMP/hlds/cstrike/server.cfg"

      - name: Start ReHLDS for a short local smoke test
        env:
          MAXPLAYERS: "20"
        run: |
          cd "$RUNNER_TEMP/hlds"
          LOG_FILE="$RUNNER_TEMP/rehlds-smoke.log"
          export LD_LIBRARY_PATH="$HOME/.steam/sdk32:$RUNNER_TEMP/steamcmd/linux32:${LD_LIBRARY_PATH:-}"
          set +e
          timeout --signal=TERM --kill-after=5s 45s \
            ./hlds_run -norestart -game cstrike -console -ip 127.0.0.1 -port 27015 \
            +maxplayers "$MAXPLAYERS" +map de_dust2 +meta list +version +sv_lan 1 \
            > "$LOG_FILE" 2>&1
          STATUS=$?
          set -e
          cat "$LOG_FILE"

          if [[ "$STATUS" -ne 124 ]]; then
            echo "ERROR: HLDS/ReHLDS exited before the smoke-test timeout (status $STATUS)." >&2
            exit 1
          fi

          # SteamAPI_Init() can emit this non-fatal diagnostic in headless
          # dedicated-server environments. Treat actual engine crashes as fatal.
          if grep -Eiq 'FATAL ERROR|Segmentation fault|Unable to initialize Steam' "$LOG_FILE"; then
            echo "ERROR: The server log contains a fatal startup or engine error." >&2
            exit 1
          fi

          grep -Eiq 'Protocol version 48' "$LOG_FILE" \
            || { echo "ERROR: GoldSrc protocol initialization was not found." >&2; exit 1; }
          grep -Eiq 'ReHLDS version:' "$LOG_FILE" \
            || { echo "ERROR: The running engine did not report its ReHLDS version." >&2; exit 1; }
          grep -Eiq 'Server IP address' "$LOG_FILE" \
            || { echo "ERROR: The game server did not report a bound address." >&2; exit 1; }
          grep -Eiq 'Server logging data to file' "$LOG_FILE" \
            || { echo "ERROR: The game server did not initialize server logging." >&2; exit 1; }
          grep -Eiq 'World triggered "Round_Start"' "$LOG_FILE" \
            || { echo "ERROR: The game did not reach the first round." >&2; exit 1; }
          grep -Eiq 'Reunion[[:space:]]+RUN' "$LOG_FILE" \
            || { echo "ERROR: ReUnion did not load through Metamod-R." >&2; exit 1; }

          echo "ReHLDS, Metamod-R, and ReUnion verified; the GoldSrc server loaded the map and reached Round_Start."

      - name: Upload smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-smoke-log
          path: ${{ runner.temp }}/rehlds-smoke.log
          if-no-files-found: ignore
          retention-days: 3
