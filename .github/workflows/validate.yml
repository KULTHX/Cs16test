name: Validate CS 1.6 ReHLDS project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: |
          bash -n scripts/validate-config.sh
          bash -n scripts/install-base-hlds.sh
          bash -n scripts/install-rehlds.sh
          bash -n scripts/install-reunion.sh
          bash -n scripts/run-public-session.sh

      - name: Validate example server configuration
        run: bash scripts/validate-config.sh config/server.cfg.example

      - name: Validate dashboard status JSON
        run: python3 -m json.tool dashboard/status.json > /dev/null

      - name: Check public session workflow settings
        run: |
          grep -Fq 'timeout-minutes: 360' .github/workflows/cs16-public-session.yml
          ! grep -Eq '^[[:space:]]*schedule:' .github/workflows/cs16-public-session.yml
          ! grep -Eq '^[[:space:]]*schedule:' dashboard/vercel.json
          grep -Fq 'GITHUB_ACTIONS_TOKEN' dashboard/api/watchdog.js
          grep -Fq '*/15 * * * *' dashboard/vercel.json
          grep -Fq 'PLAYIT_SECRET_KEY' .github/workflows/cs16-public-session.yml
          grep -Fq 'ghcr.io/playit-cloud/playit-agent:1.0' scripts/run-public-session.sh
          grep -Fq 'docker inspect' scripts/run-public-session.sh
          grep -Fq '20400' scripts/run-public-session.sh
          python3 -m json.tool dashboard/vercel.json > /dev/null
          node --check dashboard/api/watchdog.js
          node --check dashboard/api/status.js
          node --check dashboard/api/control.js
          python3 -m json.tool dashboard/package.json > /dev/null
          grep -Fq 'goldsrc-query' dashboard/package.json
