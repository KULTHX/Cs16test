name: Validate CS 1.6 ReHLDS project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and FastDL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: |
          bash -n scripts/install-base-hlds.sh
          bash -n scripts/install-rehlds.sh
          bash -n scripts/install-reunion.sh
          bash -n scripts/run-public-session.sh

      - name: Test Zombie Plague FastDL export and map rotation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/export-necrohazard-fastdl.py scripts/test-export-necrohazard-fastdl.py
          python3 scripts/test-export-necrohazard-fastdl.py
          bash -n scripts/run-public-session.sh

      - name: Verify GoldSrc FastDL sends fixed-length HTTP bodies
        shell: bash
        run: |
          set -euo pipefail
          check_fastdl() {
            local url="$1" headers code
            headers="$(mktemp)"
            code="$(curl --fail --silent --show-error --http1.1 --location \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url")"
            test "$code" = "200"
            grep -Eiq '^content-length: [1-9][0-9]*' "$headers"
            if grep -Eiq '^transfer-encoding:.*chunked' "$headers"; then
              echo "ERROR: FastDL response used chunked transfer encoding: $url" >&2
              cat "$headers" >&2
              exit 1
            fi
            rm -f "$headers"
            echo "FastDL fixed-length response OK: $url"
          }
          check_fastdl "https://raw.githubusercontent.com/KULTHX/Cs16test/main/dashboard/fastdl/cstrike/models/csgo/v_ak47.mdl"
          check_fastdl "https://raw.githubusercontent.com/KULTHX/Cs16test/main/dashboard/fastdl/cstrike/sound/zombie_plague/zaphie/countdown/9.wav"

      - name: Validate dashboard status JSON
        run: python3 -m json.tool dashboard/status.json > /dev/null

      - name: Check public session workflow settings
        run: |
          grep -Fq 'timeout-minutes: 360' .github/workflows/cs16-public-session.yml
          ! grep -Eq '^[[:space:]]*schedule:' .github/workflows/cs16-public-session.yml
          ! grep -Eq '^[[:space:]]*schedule:' dashboard/vercel.json
          grep -Fq 'GITHUB_ACTIONS_TOKEN' dashboard/api/watchdog.js
          grep -Fq '*/15 * * * *' dashboard/vercel.json
          grep -Fq '"jitter": 15' dashboard/vercel.json
          grep -Fq 'PLAYIT_SECRET_KEY' .github/workflows/cs16-public-session.yml
          grep -Fq 'ghcr.io/playit-cloud/playit-agent:1.0' scripts/run-public-session.sh
          grep -Fq 'docker inspect' scripts/run-public-session.sh
          grep -Fq '20400' scripts/run-public-session.sh
          grep -Fq 'rm -f "$HLDS_DIR/cstrike/server.cfg"' scripts/run-public-session.sh
          grep -Fq '+sv_downloadurl' scripts/run-public-session.sh
          ! grep -Fq 'server.cfg.example' .github/workflows/cs16-public-session.yml
          grep -Fq 'config/ssh/authorized_keys' scripts/run-public-session.sh
          grep -Fq 'ListenAddress 127.0.0.1' scripts/run-public-session.sh
          grep -Fq 'AllowTcpForwarding no' scripts/run-public-session.sh
          grep -Fq 'ekzhang/bore:0.6.0 local 22' scripts/run-public-session.sh
          grep -Fq 'ekzhang/bore:0.6.0' scripts/run-public-session.sh
          grep -Fq 'BORE SSH TUNNEL READY' scripts/run-public-session.sh
          grep -Fq 'bore.log' .github/workflows/cs16-public-session.yml
          python3 -m json.tool dashboard/vercel.json > /dev/null
          node --check dashboard/api/watchdog.js
          grep -Fq 'export const POST = handleSchedule(runWatchdog)' dashboard/api/watchdog.js
          node --check dashboard/api/status.js
          node --check dashboard/api/control.js
          python3 -m json.tool dashboard/package.json > /dev/null
          grep -Fq 'goldsrc-query' dashboard/package.json
